
<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Database</title>
  <style>
    /* Layout only: no colors, fonts, or decoration. */
    /* ALTERED (Version B layout): margin-bottom added below the Create/Read/Update buttons. */
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }
 
    .edit {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px
    }
 
    .edit[hidden] {
      display: none
    }
 
    .edit .wide {
      grid-column: 1/-1
    }
 
    .edit .btns {
      grid-column: 1/-1;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }
 
    /* ALTERED (Version B layout): the old .filters grid is now .fgrid (the filter fields), and .fbar holds the
       Show database / Show filters / Reset buttons. .filters itself is just the wrapper for both. */
    .fgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px
    }
 
    .fgrid[hidden] {
      display: none
    }
 
    .fbar {
      display: flex;
      gap: 14px;
      flex-wrap: wrap
    }
 
    .fbar+.fgrid:not([hidden]) {
      margin-top: 12px
    }
 
    .filters[hidden] {
      display: none
    }
 
    /* ALTERED (Version B layout): button styling now also covers the buttons in .fbar. */
    .actions button,
    .fbar button {
      padding: 6px 16px;
      border: 1px solid rgba(128, 128, 128, .7);
      border-radius: 6px;
      box-shadow: 0 2px 3px rgba(0, 0, 0, .3)
    }
 
    .actions button.on,
    .fbar button.on,
    .fbar button.flash {
      font-weight: bold;
      background: rgba(128, 128, 128, .3);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, .45);
      transform: translateY(1px)
    }
 
    label {
      display: flex;
      flex-direction: column
    }
 
    /* ADDED: labels use display:flex above, which overrides the browser's default "hidden" behavior,
       so this rule is needed for data-role to be able to hide a label (the Client filter for client users). */
    label[hidden] {
      display: none
    }
 
    /* ALTERED (Version B layout): checkbox label is aligned to the bottom of its grid row instead of padded down. */
    .chk {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      align-self: end;
      padding-bottom: 3px
    }
 
    .wrap {
      overflow-x: auto
    }
 
    .bar {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap
    }
 
    /* REMOVED (Version B layout): ".bar .chk { padding-top: 0 }" - the Show database checkbox in .bar is now a button. */
 
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1000px
    }
 
    th,
    td {
      padding: 9px 10px;
      text-align: left;
      white-space: nowrap
    }
 
    th,
    tr.row {
      cursor: pointer
    }
 
    tr.det td {
      white-space: normal
    }
 
    .dg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px 18px
    }
 
    .dg small {
      display: block
    }
 
    .empty {
      text-align: center
    }
 
    /* ADDED (Version B): smaller padding for the Archive / Un-archive button inside table rows. */
    .abtn {
      padding: 3px 10px
    }
  </style>
</head>
 
<body>
  <!-- CHANGED (Assignment 7): the mock "I am:" dropdown was replaced by real Supabase sign-in.
       The role comes from the server (user_roles table), and the server only returns the rows this user may see. -->
  <p><span id="roleBanner">Checking sign-in…</span> <button type="button" id="signOut">Sign out</button></p>
  <p id="roleMsg" role="status"></p>
  <p id="dbmsg" role="status"></p>
 
  <!-- ADDED: wrapper (closed just before the <script> tag). Hidden until a user is selected. -->
  <main id="app" hidden>
  <h1>Event Requests</h1>
  <p class="sub">Click a column to sort, click a row for details</p>
  <div class="actions">
    <!-- CHANGED: data-role="client" because event requests are submitted by clients -->
    <button id="bCreate" type="button" data-role="client" onclick="window.location.href='eventForm.html';">Create</button>
    <button id="bRead" type="button">Read</button>
    <!-- ALTERED: data-role="coordinator" so this button is only shown to coordinators (clients can't update records). -->
    <button id="bUpdate" type="button" data-role="coordinator">Update</button>
  </div>
  <div class="edit" id="edit" hidden>
    <label class="wide">Request to update<select id="eid"></select></label>
    <!-- CHANGED (Assignment 7): staff can change Status, Priority, Coordinator and Room. The other fields are shown read-only. -->
    <p class="wide">Staff can change status, priority, coordinator, and room. Other details are read-only.</p>
    <label>Name<input id="f_name" maxlength="200" disabled></label>
    <label>Category<select id="f_cat" disabled></select></label>
    <label>Type<input id="f_type" disabled></label>
    <!-- ALTERED (Version B): Client, Coordinator and Room are now dropdowns of names (filled by the script) instead of number boxes. -->
    <label>Client<select id="f_c" disabled></select></label>
    <label>Coordinator<select id="f_co"></select></label>
    <label>Room<select id="f_r"></select></label>
    <label>Start<input id="f_s" type="datetime-local" disabled></label>
    <label>End<input id="f_e" type="datetime-local" disabled></label>
    <label>Attendance (2–350)<input id="f_att" type="number" min="2" max="350" disabled></label>
    <!-- REMOVED (Sq ft decision): the Sq ft field was dropped everywhere (it had no input here, which caused an error when opening this panel). -->
    <label>Priority<select id="f_pri"></select></label>
    <label>Status<select id="f_st"></select></label>
    <label>Furniture<input id="f_fur" disabled></label>
    <label>Technology<input id="f_tech" disabled></label>
    <label>Catering<input id="f_cater" maxlength="200" disabled></label>
    <label class="wide">Notes<textarea id="f_notes" rows="3" maxlength="2000" disabled></textarea></label>
    <div class="btns">
      <button id="bSave" type="button">Save changes</button>
      <button id="bCancel" type="button">Cancel</button>
      <span id="msg" role="status"></span>
    </div>
  </div>
  <!-- ALTERED (Version B layout): the filter area starts hidden (Read shows it). It now has a button bar
       (Show filters / Reset filters) above a collapsible grid of filter fields. -->
  <div class="filters" hidden>
    <div class="fbar"><button id="showFil" type="button" aria-pressed="false">Show filters</button><button id="reset" type="button">Reset filters</button></div>
    <div class="fgrid" id="fgrid" hidden>
      <label>Search<input id="q" placeholder="Name, type, notes, ID"></label>
      <!-- ADDED (Version B filter): Client filter. data-role="coordinator" hides it from client users so they can't see other clients' names. -->
      <label data-role="coordinator">Client<select id="fc"></select></label>
      <label>Coordinator<select id="co"></select></label>
      <label>Type<select id="type"></select></label>
      <label>Category<select id="cat"></select></label>
      <label>Room<select id="room"></select></label>
      <label>Min attendance<input id="amin" type="number" min="2" max="350"></label>
      <label>Starts on/after<input id="d1" type="date"></label>
      <label>Starts on/before<input id="d2" type="date"></label>
      <label>Priority<select id="pri"></select></label>
      <label>Status<select id="st"></select></label>
      <label>Sort by<select id="sort"></select></label>
      <label class="chk"><input id="arc" type="checkbox"> Show archived</label>
    </div>
  </div>
  <!-- ALTERED (Version B layout): the count is only shown together with the table (Show database). -->
  <div class="bar"><span id="count"></span></div>
  <div id="dbmsg" class="dbmsg"></div>
  <div class="wrap" id="tblwrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  </main>
  <!-- END of ADDED wrapper -->
 
  <script>
var PR=['urgent','high','medium','low'],
ST=['submitted','in_progress','scheduled','declined','cancelled','needs_followup','completed'],
CAT=['public','private','tenant'];
/* CHANGED (Assignment 7): the page no longer talks to Supabase directly. It calls the Express server
   (see load() below), which checks the sign-in token and role before reading the database. */
var CL={},CO={},RM={},D=[];
function nm(m,id){return id==null?'—':(m[id]||String(id))}

    var $ = function (i) { return document.getElementById(i) };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
    function fmt(s) { return s ? new Date(s).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—' }
    function lab(s) { return String(s).replace(/_/g, ' ') }
    /* ALTERED: uses scoped() instead of D so the Type filter list only contains values from
       requests the current user is allowed to see (otherwise a client would see other clients' values). */
    function uniq(k) { return scoped().map(function (x) { return x[k] }).filter(function (v, i, a) { return v != null && a.indexOf(v) === i }).sort(function (a, b) { return a > b ? 1 : -1 }) }
    function opts(el, all, arr) { el.innerHTML = (all ? '<option value="">' + all + '</option>' : '') + arr.map(function (v) { return '<option value="' + esc(v) + '">' + esc(lab(v)) + '</option>' }).join('') }
    // ADDED (Version B): builds a dropdown from an id -> name map. "all" adds a blank-value first option, "none" adds a "none" option last.
    function optsMap(el, all, map, none) {
      var h = all ? '<option value="">' + all + '</option>' : '';
      h += Object.keys(map).map(function (k) { return '<option value="' + k + '">' + esc(map[k]) + '</option>' }).join('');
      if (none) h += '<option value="none">' + none + '</option>';
      el.innerHTML = h;
    }
    /* ALTERED: Room and Coordinator filter lists now show names (Version B), and for client users only the rooms
       and coordinators that appear on their own requests (visibleMap, defined in the role section below). */
    function buildFilters() {
      var keep = { type: $('type').value, room: $('room').value, co: $('co').value };
      opts($('type'), 'All types', uniq('type'));
      optsMap($('room'), 'All rooms', visibleMap(RM, 'r'), 'No room assigned');
      optsMap($('co'), 'All coordinators', visibleMap(CO, 'co'));
      ['type', 'room', 'co'].forEach(function (k) { $(k).value = keep[k] });
    }
    opts($('cat'), 'All categories', CAT); opts($('st'), 'All statuses', ST); opts($('pri'), 'All priorities', PR); buildFilters();
    // ADDED (Version B): Client filter list and the three name dropdowns in the update form (all clients, coordinators and the 7 rooms)
    optsMap($('fc'), 'All clients', CL);
    optsMap($('f_c'), '', CL); optsMap($('f_co'), '', CO); optsMap($('f_r'), 'No room assigned', RM);
    opts($('f_cat'), '', CAT); opts($('f_pri'), '', PR); opts($('f_st'), '', ST);
    // ALTERED (Version B): 12 columns. End, Guests and Created moved into the expandable detail row; headers renamed; Archive column added; Sq ft removed.
    var COLS = [['id', 'ID'], ['name', 'Event'], ['c', 'Client'], ['type', 'Type'], ['cat', 'Category'], ['r', 'Room'], ['s', 'Start'], ['pri', 'Priority'], ['co', 'Staff'], ['st', 'Status'], ['act', 'Archive'], ['ar', 'Archived']];
    var SORTS = [['s:asc', 'Start (soonest)'], ['s:desc', 'Start (latest)'], ['cr:desc', 'Created (newest)'], ['cr:asc', 'Created (oldest)'], ['pri:asc', 'Priority (highest first)'], ['st:asc', 'Status'], ['att:desc', 'Attendance (largest)'], ['name:asc', 'Name A–Z']];
    $('sort').innerHTML = SORTS.map(function (s) { return '<option value="' + s[0] + '">' + s[1] + '</option>' }).join('');
    // ALTERED (Version B): "recent" remembers rows archived since the filters last changed, so they don't vanish the moment you click Archive.
    var key = 's', dir = 1, selId = null, openRows = {}, recent = {};
    // ADDED (Version B): archive helpers. Archiving stamps the current local time; un-archiving clears it.
    function doArchive(x) { if (x.ar) return; x.ar = nowLocal() }
    function doUnarchive(x) { if (!x.ar) return; x.ar = null }
    function nowLocal() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) }
    // ALTERED (Version B): client, coordinator and room now sort by name instead of id.
    function rank(k, v) { if (k === 'c') return CL[v]; if (k === 'co') return CO[v]; if (k === 'r') return v == null ? null : RM[v]; if (k === 'pri') return PR.indexOf(v); if (k === 'st') return ST.indexOf(v); return v }
    function filtered() {
      var q = $('q').value.toLowerCase(), f = { cat: $('cat').value, type: $('type').value, st: $('st').value, pri: $('pri').value, room: $('room').value, co: $('co').value, c: $('fc').value };
      var amin = +$('amin').value || 0, d1 = $('d1').value, d2 = $('d2').value, arc = $('arc').checked;
      /* ALTERED: filters scoped() instead of D, so a client only ever gets their own requests
         (coordinators get everything). */
      return scoped().filter(function (x) {
        /* ALTERED (Show archived decision = Version A behavior): unchecked hides archived rows, checked shows active AND archived rows.
           Rows archived since the last filter change stay visible (the "recent" exception, from Version B's archive buttons). */
        if (!arc && x.ar && !recent[x.id]) return false;
        if (f.cat && x.cat !== f.cat) return false; if (f.type && x.type !== f.type) return false;
        if (f.st && x.st !== f.st) return false; if (f.pri && x.pri !== f.pri) return false;
        if (f.co && String(x.co) !== f.co) return false;
        if (f.c && String(x.c) !== f.c) return false; // ADDED (Version B): Client filter
        if (f.room === 'none') { if (x.r != null) return false } else if (f.room && String(x.r) !== f.room) return false;
        if (x.att < amin) return false;
        if (d1 && x.s.slice(0, 10) < d1) return false; if (d2 && x.s.slice(0, 10) > d2) return false;
        // ALTERED (Version B): search also matches client, coordinator and room names
        if (q && (x.name + ' ' + x.type + ' ' + x.notes + ' ' + x.fur + ' ' + x.tech + ' ' + x.id + ' ' + nm(CL, x.c) + ' ' + nm(CO, x.co) + ' ' + nm(RM, x.r)).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
    }
    function render() {
      var rows = filtered().sort(function (a, b) {
        var x = rank(key, a[key]), y = rank(key, b[key]);
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        return (x > y ? 1 : x < y ? -1 : 0) * dir;
      });
      $('thead').innerHTML = '<tr>' + COLS.map(function (c) { return '<th data-k="' + c[0] + '" class="' + (c[0] === key ? 'on' : '') + '">' + c[1] + (c[0] === key ? ' <span class="ar">' + (dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>' }).join('') + '</tr>';
      $('tbody').innerHTML = rows.length ? rows.map(function (x) {
        // ADDED: only coordinators get the Archive / Un-archive button; clients see a dash
        var archiveCell = currentRole === 'coordinator' ? '<button type="button" class="abtn" data-id="' + x.id + '">' + (x.ar ? 'Un-archive' : 'Archive') + '</button>' : '—';
        /* ALTERED (Version B): row now shows names, 12 columns, and the Archive cell; End, Guests and Created are in the detail row. */
        return '<tr class="row' + (x.ar ? ' arch' : '') + (x.id === selId ? ' sel' : '') + '" data-id="' + x.id + '"><td>' + x.id + '</td><td>' + esc(x.name) + '</td><td>' + esc(nm(CL, x.c)) + '</td><td>' + esc(x.type) + '</td><td>' + esc(x.cat) + '</td><td>' + esc(nm(RM, x.r)) + '</td><td>' + fmt(x.s) + '</td><td>' + esc(lab(x.pri)) + '</td><td>' + esc(nm(CO, x.co)) + '</td><td>' + esc(lab(x.st)) + '</td><td>' + archiveCell + '</td><td>' + fmt(x.ar) + '</td></tr>' +
          '<tr class="det" id="d' + x.id + '"' + (openRows[x.id] ? '' : ' hidden') + '><td colspan="12"><div class="dg"><div><small>End</small>' + fmt(x.e) + '</div><div><small>Guests</small>' + x.att + '</div><div><small>Created</small>' + fmt(x.cr) + '</div><div><small>Furniture</small>' + esc(x.fur || '—') + '</div><div><small>Technology</small>' + esc(x.tech || '—') + '</div><div><small>Catering</small>' + esc(x.cater || '—') + '</div><div><small>Notes</small>' + esc(x.notes || '—') + '</div></div></td></tr>';
      }).join('') : '<tr><td colspan="12" class="empty">No event requests match these filters.</td></tr>';
      // ALTERED: the total now counts only the requests this user can see (it used D.length, which would reveal the overall total to clients).
      $('count').textContent = rows.length + ' of ' + scoped().length + ' requests shown';
    }
    document.querySelector('.filters').addEventListener('input', function (e) {
      recent = {}; // ADDED (Version B): changing a filter clears the "recently archived" exception
      if (e.target.id === 'sort') { var p = e.target.value.split(':'); key = p[0]; dir = p[1] === 'asc' ? 1 : -1 }
      render();
    });
    $('thead').addEventListener('click', function (e) {
      var th = e.target.closest('th'); if (!th) return;
      var k = th.getAttribute('data-k'); if (k === 'act') return; // ALTERED (Version B): the Archive column can't be sorted
      if (k === key) dir = -dir; else { key = k; dir = 1 }
      $('sort').value = ''; render();
    });
    $('tbody').addEventListener('click', async function (e) {
      // ADDED (Version B): clicking Archive / Un-archive changes the row's archived date without opening its details
      var ab = e.target.closest('button.abtn');
      if (ab) {
        // ADDED guard: clients can't archive or un-archive (the buttons aren't drawn for them; the SERVER also rejects it with 403)
        if (currentRole !== 'coordinator') { $('roleMsg').textContent = 'Clients are not allowed to update records.'; return }
        var r = get(+ab.getAttribute('data-id'));
        if (!r) return;
        // CHANGED (Assignment 7): archiving is saved to the database through the server
        var res = await window.wellspring.api('PATCH', '/api/events/' + r.id, { archived: !r.ar });
        if (!res.ok) { $('roleMsg').textContent = 'Not saved: ' + res.data.error; return }
        if (!r.ar) recent[r.id] = true;
        $('roleMsg').textContent = (r.ar ? 'Un-archived' : 'Archived') + ' request #' + r.id + '.';
        await load();
        return
      }
      var tr = e.target.closest('tr.row'); if (!tr) return;
      var id = +tr.getAttribute('data-id');
      openRows[id] = !openRows[id]; selId = id;
      if (!$('edit').hidden) loadForm(id);
      render();
    });
    $('reset').addEventListener('click', function () {
      // ALTERED (Version B): brief "pressed" flash on the button, the new Client filter is also cleared, and "recent" is reset
      var rb = this; rb.classList.add('flash'); setTimeout(function () { rb.classList.remove('flash') }, 250);
      ['q', 'amin', 'd1', 'd2'].forEach(function (i) { $(i).value = '' });
      ['cat', 'type', 'st', 'pri', 'room', 'co', 'fc'].forEach(function (i) { $(i).value = '' });
      $('arc').checked = false; $('sort').value = 's:asc'; key = 's'; dir = 1; recent = {}; render();
    });
 
    /* ---- Create / Read / Update ---- */
    // Create is a placeholder for now (no handler yet).
    // Read shows/hides the filters and the update panel; active filters stay applied while hidden.
    $('bRead').addEventListener('click', function () {
      var f = document.querySelector('.filters');
      if (f.hidden) f.hidden = false;            // show filters (update panel left as is)
      else if (!$('edit').hidden) $('edit').hidden = true; // update open: keep filters, close update
      else { f.hidden = true; fgShown = false;} // ALTERED (Version B): plain read mode also hides the panel and clears Show filters / Show database
      syncBtns();
    });
    function get(id) { for (var i = 0; i < D.length; i++)if (D[i].id === id) return D[i]; return null }
    // ALTERED (Sq ft decision): sq removed from this list
    var MAP = { name: 'name', cat: 'cat', type: 'type', c: 'c', co: 'co', r: 'r', s: 's', e: 'e', att: 'att', pri: 'pri', st: 'st', fur: 'fur', tech: 'tech', cater: 'cater', notes: 'notes' };
    function fillPick() {
      $('eid').innerHTML = D.map(function (x) { return '<option value="' + x.id + '">#' + x.id + ' – ' + esc(x.name) + '</option>' }).join('');
      $('eid').value = selId;
    }
    function loadForm(id) {
      var x = get(id); if (!x) return;
      selId = id; $('eid').value = id; $('msg').textContent = '';
      Object.keys(MAP).forEach(function (k) { $('f_' + k).value = x[k] == null ? '' : x[k] });
    }
    // ALTERED (Version B layout): also keeps the Show filters / Show database buttons, filter grid, table and count in sync
    function syncBtns() {
      var f = !document.querySelector('.filters').hidden, u = !$('edit').hidden;
      $('bRead').classList.toggle('on', f); $('bRead').setAttribute('aria-pressed', f);
      $('bUpdate').classList.toggle('on', u); $('bUpdate').setAttribute('aria-pressed', u);
      $('fgrid').hidden = !fgShown; $('showFil').classList.toggle('on', fgShown); $('showFil').setAttribute('aria-pressed', fgShown);
    }
    function showEdit(show) {
      /* ALTERED: added this guard so a client can never open the update panel, even if the Update button
         were somehow clicked. Everything below the guard is the original code, unchanged.
         (currentRole is defined in the ADDED role section at the bottom of this script.) */
      if (show && currentRole !== 'coordinator') {
        $('roleMsg').textContent = 'Clients are not allowed to update records.';
        return;
      }
      if (show && !D.length) { $('roleMsg').textContent = 'There are no requests to update.'; return }
      $('edit').hidden = !show;
      if (show) { if (selId == null || !get(selId)) selId = D[0].id; fillPick(); loadForm(selId) }
      syncBtns();
    }
    $('bUpdate').addEventListener('click', function () { showEdit($('edit').hidden) });
    $('bCancel').addEventListener('click', function () { showEdit(false) });
    $('eid').addEventListener('change', function () { selId = +$('eid').value; loadForm(selId); render() });
    // CHANGED (Assignment 7): Save sends only the changed fields to the server (PATCH /api/events/:id).
    // The server checks that the user is staff and validates every value before saving.
    $('bSave').addEventListener('click', async function () {
      var x = get(+$('eid').value); if (!x) return;
      var body = {};
      if ($('f_st').value !== x.st) body.status = $('f_st').value;
      if ($('f_pri').value !== x.pri) body.priority = $('f_pri').value;
      if ($('f_co').value !== String(x.co)) body.co_id = $('f_co').value;
      if ($('f_r').value !== (x.r == null ? '' : String(x.r))) body.r_id = $('f_r').value || null;
      if (!Object.keys(body).length) { $('msg').textContent = 'No changes to save.'; return }
      $('msg').textContent = 'Saving…';
      var res = await window.wellspring.api('PATCH', '/api/events/' + x.id, body);
      if (!res.ok) { $('msg').textContent = 'Not saved: ' + (res.data.errors || [res.data.error]).join(' '); return }
      selId = x.id; await load(); fillPick(); loadForm(x.id);
      $('msg').textContent = 'Saved changes to #' + x.id + '.';
    });
    /* ALTERED (Version B layout): Show database is now a button (it was a checkbox), and there is a new Show filters button.
       fgShown / tblShown track whether the filter grid and the table are open. */
    var fgShown = false;
    $('showFil').addEventListener('click', function () { fgShown = !fgShown; syncBtns() });
    $('sort').value = 's:asc'; render(); syncBtns();
 
    /* ---- CHANGED (Assignment 7): roles come from real sign-in ----
       The module script at the bottom signs the user in, asks the server for their role, and calls applyRole().
       Any element with a data-role attribute is shown only to the roles listed in it (space-separated).
       Hiding elements is only for convenience: the SERVER decides which rows are returned and who may update. */
    var currentRole = '';
    // The server already returns only the requests this user may see (clients: their own; staff: all).
    function scoped() { return D; }
    // ADDED: for client users, trims an id -> name map (rooms, coordinators) down to the ids that appear on their own requests,
    // so their filter lists don't reveal other clients' rooms or staff. Coordinators get the full map.
    function visibleMap(map, k) {
      if (currentRole !== 'client') return map;
      var out = {};
      scoped().forEach(function (x) { if (x[k] != null && map[x[k]] != null) out[x[k]] = map[x[k]] });
      return out;
    }
    // role is "client" or "coordinator" (staff); label is shown in the banner.
    function applyRole(role, label) {
      currentRole = role;
      // Start each user with a clean view: clear the filters, rebuild the filter lists from only their rows, and redraw
      $('reset').click(); buildFilters(); render();
      $('app').hidden = !role;
      document.querySelectorAll('[data-role]').forEach(function (el) {
        el.hidden = !role || el.getAttribute('data-role').split(' ').indexOf(role) < 0;
      });
      if (role !== 'coordinator' && !$('edit').hidden) showEdit(false); // close the update panel if it was open
      $('roleBanner').textContent = role ? 'Signed in as ' + label : '';
      $('roleMsg').textContent = '';
    }

  /* ---- CHANGED (Assignment 7): load data through the Express server ----
     GET /api/events returns each event with its related client, room and coordinator rows. */
function txt(v){return Array.isArray(v)?v.join(', '):(v==null?'':String(v))}
function iso(v){
  if(!v)return null;var d=new Date(v);if(isNaN(d))return null;
  var p=function(n){return(n<10?'0':'')+n};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
async function load(){
  var api=window.wellspring.api, staff=currentRole==='coordinator';
  $('dbmsg').textContent='Loading data…';
  // archived=1 so the "Show archived" checkbox can work on the page
  var calls=[api('GET','/api/events?archived=1')];
  if(staff)calls.push(api('GET','/api/rooms'),api('GET','/api/coordinators')); // full lists for the update dropdowns
  var res=await Promise.all(calls);
  if(!res[0].ok){$('dbmsg').textContent='Could not load data: '+res[0].data.error;return}
  CL={};CO={};RM={};
  res[0].data.forEach(function(r){
    if(r.client)CL[r.c_id]=r.client.c_name;
    if(r.coordinator)CO[r.co_id]=r.coordinator.co_name;
    if(r.room)RM[r.r_id]=r.room.r_name;
  });
  if(staff&&res[1].ok)res[1].data.forEach(function(r){RM[r.r_id]=r.r_name+(r.r_status==='Available'?'':' ('+r.r_status+')')});
  if(staff&&res[2].ok)res[2].data.forEach(function(c){CO[c.co_id]=c.co_name});
  D=res[0].data.map(function(r){return{
    id:r.e_id,c:r.c_id,co:r.co_id,r:r.r_id==null?null:r.r_id,
    cat:r.e_category,type:r.e_type,name:r.e_name,
    s:iso(r.e_start)||'',e:iso(r.e_end)||'',att:r.e_attendance,
    fur:txt(r.e_furniture),tech:txt(r.e_tech),cater:txt(r.e_catering),notes:txt(r.e_notes),
    pri:r.e_priority,st:r.e_status,cr:iso(r.e_created_at),ar:iso(r.e_archived_at)
  }});
  optsMap($('fc'),'All clients',CL);
  optsMap($('f_c'),'',CL);optsMap($('f_co'),'',CO);optsMap($('f_r'),'No room assigned',RM);
  buildFilters();$('dbmsg').textContent=D.length?'':'No event requests yet.';render();
}
  </script>

  <!-- ADDED (Assignment 7): sign-in check. Sends signed-out visitors to the sign-in page. -->
  <script type="module">
    import { requireSignIn, signOut } from '/auth.js';
    document.getElementById('signOut').onclick = signOut;
    const me = await requireSignIn();
    if (!me.isStaff && !me.client) location.href = '/login.html'; // new client: create profile first
    const label = me.email + (me.isStaff ? ' (staff)' : ' (client: ' + me.client.c_name + ')');
    applyRole(me.isStaff ? 'coordinator' : 'client', label);
    await load();
  </script>
